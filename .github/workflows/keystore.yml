name: Generate Signing Keystore

on:
  workflow_dispatch:

jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v -keystore keystore.jks -keyalg RSA \
            -keysize 2048 -validity 10000 -storepass fintrack2026 \
            -keypass fintrack2026 -alias fintrack \
            -dname "CN=FinTrack, OU=Personal, O=FinTrack, L=Jakarta, ST=DKI Jakarta, C=ID"
      - name: Cetak nilai yang perlu disimpan
        run: |
          echo "=== KEYSTORE_B64 (salin seluruh isi baris ini) ==="
          base64 -w0 keystore.jks
          echo ""
          echo "=== Lalu simpan ke GitHub Secrets repo ini ==="
          echo "KEYSTORE_B64 = nilai base64 di atas"
          echo "KEYSTORE_PASS = fintrack2026"
          echo "KEY_ALIAS = fintrack"
          echo "KEY_PASS = fintrack2026"